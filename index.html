<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eli & Chim</title>

<!-- 🎨 CSS -->
<link rel="stylesheet" href="style.css">

<!-- 📱 ICÔNE APP (IMPORTANT) -->
<link rel="apple-touch-icon" href="icon.png">

<!-- 📱 MODE APP iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>

<body>

<!-- 🔑 LOGIN -->
<div id="login">
  <h1>Mot de passe</h1>
  <input type="password" id="password">
  <button onclick="checkPassword()">Entrer</button>
</div>

<!-- 🌸 APP -->
<div id="app" class="hidden">

  <!-- déco simple -->
  <div class="decor top-left">🌞 Eli / 🌙 Chim</div>
  <div class="decor top-right">🐦</div>
  <div class="decor bottom-left">🐱💗</div>
  <div class="decor bottom-right">🐰</div>

  <!-- 🧱 CASES -->
  <div class="container">

    <div class="card" onclick="openVoice()">
      <img src="images/voice.jpg">
      <h2>Voice</h2>
    </div>

    <div class="card" onclick="openMemory()">
      <img src="images/memory.JPG">
      <h2>Memory</h2>
    </div>

    <div class="card" onclick="openEli()">
      <img src="images/eli.JPG">
      <h2>Eli</h2>
    </div>

  </div>

</div>

<!-- ⚙️ JS -->
<script src="script.js"></script>

</body>
</html>
