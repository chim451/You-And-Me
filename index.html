<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Eli & Chim</title>

<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="icon.jpg">
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox">
    <input type="password" id="password" placeholder="code">
    <button onclick="login()">Entrer</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<!-- HOME -->
<div id="home" class="screen active">

  <div class="grid">

    <div class="card" onclick="openScreen('voice')">
      <img src="images/voice.jpg">
      <p>Voice</p>
    </div>

    <div class="card" onclick="openScreen('memory')">
      <img src="images/memory.jpg">
      <p>Memory</p>
    </div>

    <div class="card" onclick="openScreen('eli')">
      <img src="images/eli.jpg">
      <p>Eli</p>
    </div>

  </div>
</div>

<!-- VOICE -->
<div id="voice" class="screen hidden">
  <div class="back" onclick="backHome()">←</div>

  <div class="voiceGrid">
    <div class="voiceCard" onclick="play('audio/goodmorning.m4a')">Good morning</div>
    <div class="voiceCard" onclick="play('audio/missyou.m4a')">Miss you</div>
    <div class="voiceCard" onclick="play('audio/brave.m4a')">Brave</div>
    <div class="voiceCard" onclick="play('audio/sad.m4a')">Sad</div>
    <div class="voiceCard" onclick="play('audio/scared.m4a')">Scared</div>
    <div class="voiceCard" onclick="play('audio/goodnight.m4a')">Good night</div>
  </div>
</div>

<!-- MEMORY -->
<div id="memory" class="screen hidden">
  <div class="back" onclick="backHome()">←</div>

  <div class="gallery">
    <img src="memory/1.jpg">
    <img src="memory/2.jpg">
    <img src="memory/3.jpg">
    <video src="memory/1.mp4" controls></video>
  </div>
</div>

<!-- ELI -->
<div id="eli" class="screen hidden">
  <div class="back" onclick="backHome()">←</div>

  <div class="videoBox">
    <iframe
      src="https://www.youtube.com/embed/c_NpIfy_c6M"
      allowfullscreen>
    </iframe>
  </div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
