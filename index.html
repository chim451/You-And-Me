<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Eli & Chim</title>

<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="icon.jpg">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox">
    <h1>🔒</h1>
    <input type="password" id="password" placeholder="mot de passe">
    <button onclick="checkPassword()">Entrer</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- HOME -->
  <div id="home" class="screen active">

    <div class="title">Eli & Chim</div>

    <div class="grid">

      <div class="card" onclick="openVoice()">
        <div class="icon voice"></div>
        <p>Voice</p>
      </div>

      <div class="card" onclick="openMemory()">
        <div class="icon memory"></div>
        <p>Memory</p>
      </div>

      <div class="card" onclick="openEli()">
        <div class="icon eli"></div>
        <p>Eli</p>
      </div>

      <div class="card" onclick="noop()">
        <div class="icon"></div>
        <p></p>
      </div>

      <div class="card" onclick="noop()">
        <div class="icon"></div>
        <p></p>
      </div>

      <div class="card" onclick="noop()">
        <div class="icon"></div>
        <p></p>
      </div>

    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden" onclick="closeModal()">
    <div id="modalContent" onclick="event.stopPropagation()"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
