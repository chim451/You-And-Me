<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Eli & Chim</title>

<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="icon.jpg">
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="glass">
    <input type="password" id="password" placeholder="code">
    <button onclick="login()">Entrer</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<!-- HOME -->
<section id="home" class="screen active">

  <div class="grid">

    <div class="card" onclick="openApp('voice')">
      <img src="images/voice.jpg">
      <p>Voice</p>
    </div>

    <div class="card" onclick="openApp('memory')">
      <img src="images/memory.jpg">
      <p>Memory</p>
    </div>

    <div class="card" onclick="openApp('eli')">
      <img src="images/eli.jpg">
      <p>Eli</p>
    </div>

  </div>
</section>

<!-- VOICE -->
<section id="voice" class="screen">

  <div class="back" onclick="back()">‹</div>

  <div class="voiceGrid">

    <div class="voiceCard" onclick="play('audio/goodmorning.m4a')">Good morning</div>
    <div class="voiceCard" onclick="play('audio/missyou.m4a')">Miss you</div>
    <div class="voiceCard" onclick="play('audio/brave.m4a')">Brave</div>
    <div class="voiceCard" onclick="play('audio/sad.m4a')">Sad</div>
    <div class="voiceCard" onclick="play('audio/scared.m4a')">Scared</div>
    <div class="voiceCard" onclick="play('audio/goodnight.m4a')">Good night</div>

  </div>
</section>

<!-- MEMORY -->
<section id="memory" class="screen">

  <div class="back" onclick="back()">‹</div>

  <div class="gallery">

    <img onclick="openMedia(this.src)" src="memory/1.jpg">
    <img onclick="openMedia(this.src)" src="memory/2.jpg">
    <img onclick="openMedia(this.src)" src="memory/3.jpg">

    <video onclick="openVideo(this)" src="memory/1.mp4"></video>

  </div>
</section>

<!-- ELI -->
<section id="eli" class="screen">

  <div class="back" onclick="back()">‹</div>

  <div class="videoWrap">
    <video controls playsinline>
      <source src="eli/video.mp4" type="video/mp4">
    </video>
  </div>

</section>

<!-- MEDIA VIEWER -->
<div id="viewer" class="hidden" onclick="closeViewer()">
  <img id="viewerImg">
</div>

</div>

<script src="script.js"></script>
</body>
</html>
